name: Migrate Otto Start

on:
  push:
    paths:
      - '.github/workflows/migrate-otto-start.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated repository
        uses: actions/checkout@v4

      - name: Fetch pinned source
        run: |
          git clone https://github.com/chistocrym-wq/otto-a1-new.git /tmp/otto-source
          cd /tmp/otto-source
          git checkout 15c11f9ff28e9c474fa206189a5c61707ed95846

      - name: Build standalone Otto Start
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public netlify package.json netlify.toml
          mkdir -p public/otto netlify/functions

          cp /tmp/otto-source/public/otto-start/style-v2.css public/
          cp /tmp/otto-source/public/otto-start/premium-v3.css public/
          cp /tmp/otto-source/public/otto-start/layout-fix-v3.css public/
          cp /tmp/otto-source/public/otto-start/learning-fixes-v4.css public/
          cp /tmp/otto-source/public/otto-start/app-v2.js public/
          cp /tmp/otto-source/public/otto-start/enhancements-v2.js public/
          cp /tmp/otto-source/public/otto-start/learning-fixes-v4.js public/
          cp /tmp/otto-source/public/otto-start/learning-fixes-v4-guard.js public/
          cp /tmp/otto-source/public/otto-start/dom-stability-v4.js public/
          cp /tmp/otto-source/public/otto-ui-experiment.js public/
          cp /tmp/otto-source/public/otto-icon-192.webp public/
          cp /tmp/otto-source/public/otto/otto-home.webp public/otto/
          cp /tmp/otto-source/public/otto/otto-guide.webp public/otto/
          cp /tmp/otto-source/public/otto/otto-horen.webp public/otto/
          cp /tmp/otto-source/public/otto/otto-lesen.webp public/otto/
          cp /tmp/otto-source/public/otto/otto-scenes.webp public/otto/

          cp /tmp/otto-source/netlify/functions/otto-tts.js netlify/functions/
          cp /tmp/otto-source/netlify/functions/otto-start-pronunciation.js netlify/functions/
          cp /tmp/otto-source/netlify/functions/otto-start-support.js netlify/functions/

          python3 - <<'PY'
          from pathlib import Path
          for name in ['learning-fixes-v4.js','learning-fixes-v4-guard.js','dom-stability-v4.js']:
              p = Path('public') / name
              s = p.read_text(encoding='utf-8')
              s = s.replace("  if (!location.pathname.startsWith('/otto-start')) return;\n", '')
              p.write_text(s, encoding='utf-8')
          p = Path('public/app-v2.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("if(el.matches('[data-main-a1]')){window.location.href='/';return}", "if(el.matches('[data-main-a1]')){window.location.href='https://otto-a1-new.netlify.app/';return}")
          p.write_text(s, encoding='utf-8')
          PY

          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <meta name="theme-color" content="#416f71" />
            <meta name="description" content="Отто Старт — постепенный путь от полного нуля в немецком до готовности начать Otto A1" />
            <title>Отто Старт — немецкий с нуля</title>
            <link rel="icon" href="/otto-icon-192.webp" type="image/webp" />
            <link rel="preload" as="image" href="/otto/otto-home.webp" type="image/webp" />
            <link rel="stylesheet" href="/style-v2.css?v=2" />
            <link rel="stylesheet" href="/premium-v3.css?v=3" />
            <link rel="stylesheet" href="/layout-fix-v3.css?v=3" />
            <link rel="stylesheet" href="/learning-fixes-v4.css?v=4" />
          </head>
          <body>
            <div id="app" aria-live="polite"></div>
            <script src="/otto-ui-experiment.js?v=3" defer></script>
            <script src="/dom-stability-v4.js?v=4" defer></script>
            <script src="/learning-fixes-v4-guard.js?v=4" defer></script>
            <script src="/learning-fixes-v4.js?v=4" defer></script>
            <script src="/app-v2.js?v=2" defer></script>
            <script src="/enhancements-v2.js?v=2" defer></script>
          </body>
          </html>
          HTML

          cat > package.json <<'JSON'
          {
            "name": "otto-start",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {"build": "node -e \"console.log('Otto Start static build ready')\""},
            "dependencies": {"@netlify/blobs": "^11.0.3"}
          }
          JSON

          cat > netlify.toml <<'TOML'
          [build]
            command = "npm run build"
            publish = "public"
            functions = "netlify/functions"

          [[headers]]
            for = "/*"
            [headers.values]
              X-Content-Type-Options = "nosniff"
              Referrer-Policy = "strict-origin-when-cross-origin"
              Permissions-Policy = "microphone=(self)"
          TOML

          cat > README.md <<'MD'
          # Otto Start

          Самостоятельное приложение «Отто Старт» — немецкий с абсолютного нуля до готовности перейти в основной Otto A1.

          Репозиторий отделён от основного Otto A1. Все дальнейшие изменения Otto Start выполняются здесь.
          MD

      - name: Validate JavaScript
        run: |
          node --check public/app-v2.js
          node --check public/enhancements-v2.js
          node --check public/learning-fixes-v4.js
          node --check public/learning-fixes-v4-guard.js
          node --check public/dom-stability-v4.js
          node --check public/otto-ui-experiment.js
          node --check netlify/functions/otto-tts.js
          node --check netlify/functions/otto-start-pronunciation.js
          node --check netlify/functions/otto-start-support.js

      - name: Commit migrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json netlify.toml public netlify
          git commit -m "Move Otto Start into standalone repository" || true
          git push origin HEAD:main
