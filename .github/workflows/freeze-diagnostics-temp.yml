name: Freeze Diagnostics Temp
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait and capture
        run: |
          set -e
          url="https://otto-start.netlify.app/api/otto-start-client-log-summary-temp"
          for i in $(seq 1 20); do
            code=$(curl -sS -o diag-latest.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              cat diag-latest.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: otto-start-freeze-latest
          path: diag-latest.json
          retention-days: 1
