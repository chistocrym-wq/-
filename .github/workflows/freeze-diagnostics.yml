name: Freeze Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for diagnostics and capture
        shell: bash
        run: |
          set -e
          url="https://otto-start.netlify.app/api/otto-start-client-log-summary"
          for i in $(seq 1 30); do
            code=$(curl -sS -o diag.json -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              cat diag.json
              exit 0
            fi
            echo "Attempt $i: HTTP $code"
            sleep 6
          done
          echo "Diagnostic endpoint did not become ready"
          cat diag.json 2>/dev/null || true
          exit 1
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: otto-start-freeze-diagnostics
          path: diag.json
          retention-days: 1
