name: Temporary Netlify production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-deploy-temp.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: 22d42eb2-978b-4085-ad30-ae56cbb2115a
    steps:
      - uses: actions/checkout@v4
      - name: Select existing Netlify credential
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_TOKEN_FALLBACK" ]; then
            echo "NETLIFY_AUTH_TOKEN=$NETLIFY_TOKEN_FALLBACK" >> "$GITHUB_ENV"
            echo "Existing NETLIFY_TOKEN secret found."
          elif [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Existing NETLIFY_AUTH_TOKEN secret found."
          else
            echo "No existing Netlify token secret is configured in this repository."
            exit 78
          fi
      - name: Deploy current main to existing otto-start production site
        run: npx -y netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
