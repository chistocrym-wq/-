name: Package Deploy Source

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Netlify MCP deploy runner
        run: npm install --no-save @netlify/mcp@latest
      - name: Upload deploy source
        uses: actions/upload-artifact@v4
        with:
          name: otto-start-deploy-source
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          path: |
            public
            netlify
            netlify.toml
            package.json
            package-lock.json
            node_modules
