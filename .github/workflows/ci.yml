name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start stable cumulative bundle
        run: |
          set -e
          for file in \
            public/index.html public/sw.js public/manifest.webmanifest \
            public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js public/course-v8.js \
            public/text-stability-v8.js public/stability-v8.js public/account-v8.js \
            public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-auth.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          for file in \
            public/sw.js public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js public/course-v8.js \
            public/text-stability-v8.js public/stability-v8.js public/account-v8.js \
            public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-auth.js; do
            echo "Syntax: $file"
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const data = fs.readFileSync('public/course-data-v8.js','utf8');
          const extra = fs.readFileSync('public/course-data-extra-v8.js','utf8');
          const core = fs.readFileSync('public/course-data-core-v8.js','utf8');
          const course = fs.readFileSync('public/course-v8.js','utf8');
          const auth = fs.readFileSync('netlify/functions/otto-start-auth.js','utf8');
          const requiredIndex = ['course-data-v8.js?v=8','course-data-extra-v8.js?v=8','course-data-core-v8.js?v=8','course-v8.js?v=8','text-stability-v8.js?v=8','account-v8.js?v=8','stability-v8.js?v=8','Otto Start','немецкий с нуля'];
          const requiredData = ["id:'family'","id:'numbers'","id:'documents'",'Großmutter','Dienstag','Sonntag','einundzwanzig','dreißig','der Bahnhof','die Schule','das Haus'];
          const requiredExtra = ["id:'daily-life'","id:'services'","id:'travel-hotel'","id:'environment'",'Briefmarke','Rezeption','aufstehen'];
          const requiredCore = ["id:'questions-actions'","id:'countries-languages'","id:'personal-things'",'können','Woher kommen Sie?','Muttersprache'];
          const requiredCourse = ['Мои выражения','3–5 мин','7–10 мин','15 мин','ottoStartCourseV8'];
          const requiredAuth = ['request-code','save-progress','load-progress','scrypt','RESEND_API_KEY','TWILIO_ACCOUNT_SID'];
          for (const needle of requiredIndex) if (!index.includes(needle)) throw new Error(`index.html missing: ${needle}`);
          for (const needle of requiredData) if (!data.includes(needle)) throw new Error(`course-data-v8.js missing: ${needle}`);
          for (const needle of requiredExtra) if (!extra.includes(needle)) throw new Error(`course-data-extra-v8.js missing: ${needle}`);
          for (const needle of requiredCore) if (!core.includes(needle)) throw new Error(`course-data-core-v8.js missing: ${needle}`);
          for (const needle of requiredCourse) if (!course.includes(needle)) throw new Error(`course-v8.js missing: ${needle}`);
          for (const needle of requiredAuth) if (!auth.includes(needle)) throw new Error(`otto-start-auth.js missing: ${needle}`);
          console.log('Static assertions passed.');
          NODE
          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error('Curriculum must contain at least 24 thematic blocks.');
          if (words.length < 500) throw new Error(`Curriculum word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          NODE
