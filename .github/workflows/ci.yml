name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start V16
        run: |
          set -e
          for file in \
            public/index.html public/otto-v12.css public/otto-v15.css public/curriculum-v16.css \
            public/client-log-v14.js public/runtime-v14.js \
            public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/speech-v16.js public/app-v15.js public/curriculum-v16.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for file in \
            public/client-log-v14.js public/runtime-v14.js public/course-data-v8.js \
            public/course-data-extra-v8.js public/course-data-core-v8.js public/speech-v16.js public/app-v15.js public/curriculum-v16.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const app = fs.readFileSync('public/app-v15.js','utf8');
          const speech = fs.readFileSync('public/speech-v16.js','utf8');
          const bridge = fs.readFileSync('public/curriculum-v16.js','utf8');
          const runtime = fs.readFileSync('public/runtime-v14.js','utf8');
          const tts = fs.readFileSync('netlify/functions/otto-tts.js','utf8');

          for (const needle of ['otto-v15.css?v=19','curriculum-v16.css?v=19','speech-v16.js?v=19','app-v15.js?v=19','curriculum-v16.js?v=19']) {
            if (!index.includes(needle)) throw new Error(`index missing ${needle}`);
          }
          for (const old of ['learning-fixes-v4.js','mutation-safety-v10.js','app-v2.js','app-v12.js?v=','app-v14.js?v=','speech-v12.js?v=','speech-v14.js?v=','speech-v15.js?v=','pwa-v12.js','cache-reset-v13.js']) {
            if (index.includes(old)) throw new Error(`old runtime still loaded: ${old}`);
          }
          if (app.includes('new MutationObserver(') || app.includes('stopImmediatePropagation')) throw new Error('unstable DOM interception returned to core app');
          if (!runtime.includes('getRegistrations') || !runtime.includes('unregister')) throw new Error('stale service worker cleanup missing');
          if (!app.includes("ALPHA('a01'") || !app.includes("ALPHA('a02'")) throw new Error('alphabet progression missing');
          if (!app.includes("RULE('r01'") || !app.includes("RULE('r04'")) throw new Error('reading-rule progression missing');
          for (const rule of ['ei','ie','sch','ichch','achch','sp','st','eu','ss','umlaut','ending']) {
            if (!app.includes(`id:'${rule}'`)) throw new Error(`reading rule missing ${rule}`);
          }
          if (!bridge.includes('От нуля — именно к тренажёру A1') || !bridge.includes('Ещё важные особенности для A1')) throw new Error('visible A1 route or reading extras missing');
          for (const rule of ['qu','ck','tz','pf','ng / nk','гласная + h']) {
            if (!bridge.includes(rule)) throw new Error(`extra reading feature missing ${rule}`);
          }
          if (!app.includes('Мини‑тест готовности к Otto A1') || !app.includes('score>=80') || !app.includes('>=60')) throw new Error('A1 readiness test missing');
          if (!app.includes('Выберите перевод на русском языке.') || !app.includes('Только здесь варианты ответа даны по-немецки.')) throw new Error('translation direction guard missing');
          if (!app.includes("WORD('z01','Первое слово'") || !app.includes("WORD('z02','Да и нет'") || !app.includes("WORD('z03','Спасибо и пожалуйста'")) throw new Error('absolute-zero progression missing');
          if (!app.includes('size=12')) throw new Error('dictionary pagination guard missing');
          if (!speech.includes('speechSynthesis') || !speech.includes("utterance.lang = 'de-DE'")) throw new Error('browser German voice fallback missing');
          if (!speech.includes('new Audio(url)') || !speech.includes('audio.play()')) throw new Error('server media fallback missing');
          if (!speech.includes('getUserMedia') || !speech.includes('MediaRecorder') || !speech.includes('/api/otto-start-pronunciation')) throw new Error('real recording pipeline missing');
          if (!speech.includes('data-play-own') || !speech.includes('SpeechRecognition') || !speech.includes('webkitSpeechRecognition')) throw new Error('recording playback or browser recognition fallback missing');
          if (!tts.includes("req.method === 'GET'") || (!tts.includes('URLSearchParams') && !tts.includes('searchParams'))) throw new Error('GET TTS playback route missing');
          if (!tts.includes('otto-tts-cache-de-v7') || !tts.includes('de-DE-hochdeutsch-v7')) throw new Error('German TTS v7 missing');
          if (!tts.includes('gpt-4o-mini-tts') || !tts.includes('gemini-3.1-flash-tts-preview') || !tts.includes('pcmToWav') || !tts.includes('isWav')) throw new Error('validated TTS providers missing');
          if (!tts.includes('Hochdeutsch')) throw new Error('German pronunciation instruction missing');
          console.log('Otto Start V16 runtime assertions passed.');
          NODE

          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error(`Too few topics: ${d.topics.length}`);
          if (words.length < 500) throw new Error(`Word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          const alphabet = d.topic('alphabet');
          if (!alphabet?.alphabet || alphabet.alphabet.length < 30) throw new Error('German alphabet data missing');
          const family = d.topic('family');
          for (const name of ['Mutter','Vater','Sohn','Tochter','Bruder','Schwester','Oma','Opa','Tante','Onkel']) {
            if (!family?.words.some(x => x.de.includes(name))) throw new Error(`Family coverage missing ${name}`);
          }
          console.log('Curriculum coverage assertions passed.');
          NODE
