name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start stable cumulative bundle
        run: |
          set -e
          for file in \
            public/index.html public/sw.js public/manifest.webmanifest \
            public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-v8.js \
            public/stability-v8.js public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js netlify/functions/otto-tts.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          for file in \
            public/sw.js public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-v8.js \
            public/stability-v8.js public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js netlify/functions/otto-tts.js; do
            echo "Syntax: $file"
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const data = fs.readFileSync('public/course-data-v8.js','utf8');
          const requiredIndex = ['course-data-v8.js?v=8','course-v8.js?v=8','stability-v8.js?v=8','Otto Start','Немецкий с нуля'];
          const requiredData = ["id:'family'","id:'numbers'","id:'documents'",'Großmutter','Dienstag','Sonntag','einundzwanzig','dreißig'];
          for (const needle of requiredIndex) {
            if (!index.includes(needle)) throw new Error(`index.html missing: ${needle}`);
          }
          for (const needle of requiredData) {
            if (!data.includes(needle)) throw new Error(`course-data-v8.js missing: ${needle}`);
          }
          console.log('Cumulative curriculum assertions passed.');
          NODE
