name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start cumulative learning bundle
        run: |
          set -e
          for file in \
            public/index.html public/sw.js public/manifest.webmanifest \
            public/client-log-v10.js public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/course-v8.js public/reading-coach-v9.js public/learning-cycle-guard-v9.js public/learning-cycle-v9.js \
            public/text-stability-v8.js public/stability-v8.js public/account-v8.js \
            public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-auth.js netlify/functions/otto-start-client-log.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          for file in \
            public/sw.js public/client-log-v10.js public/request-timeout-v7.js public/offline-v5.js public/pronunciation-v5.js \
            public/speech-preload-queue-v7.js public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/course-v8.js public/reading-coach-v9.js public/learning-cycle-guard-v9.js public/learning-cycle-v9.js \
            public/text-stability-v8.js public/stability-v8.js public/account-v8.js \
            public/learning-fixes-v4-guard.js public/learning-fixes-v4.js \
            public/app-v2.js public/enhancements-v2.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-auth.js netlify/functions/otto-start-client-log.js; do
            echo "Syntax: $file"
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const data = fs.readFileSync('public/course-data-v8.js','utf8');
          const extra = fs.readFileSync('public/course-data-extra-v8.js','utf8');
          const core = fs.readFileSync('public/course-data-core-v8.js','utf8');
          const course = fs.readFileSync('public/course-v8.js','utf8');
          const reading = fs.readFileSync('public/reading-coach-v9.js','utf8');
          const cycle = fs.readFileSync('public/learning-cycle-v9.js','utf8');
          const cycleGuard = fs.readFileSync('public/learning-cycle-guard-v9.js','utf8');
          const stability = fs.readFileSync('public/text-stability-v8.js','utf8');
          const clientLog = fs.readFileSync('public/client-log-v10.js','utf8');
          const auth = fs.readFileSync('netlify/functions/otto-start-auth.js','utf8');
          const serverLog = fs.readFileSync('netlify/functions/otto-start-client-log.js','utf8');
          const requiredIndex = ['client-log-v10.js?v=10','course-data-v8.js?v=8','course-data-extra-v8.js?v=8','course-data-core-v8.js?v=8','learning-cycle-guard-v9.js?v=9','learning-cycle-v9.js?v=9','course-v8.js?v=8','reading-coach-v9.js?v=9','account-v8.js?v=8','stability-v8.js?v=8','text-stability-v8.js?v=9','Otto Start','немецкий с нуля'];
          const requiredData = ["id:'family'","id:'numbers'","id:'documents'",'Großmutter','Dienstag','Sonntag','einundzwanzig','dreißig','der Bahnhof','die Schule','das Haus'];
          const requiredExtra = ["id:'daily-life'","id:'services'","id:'travel-hotel'","id:'environment'",'Briefmarke','Rezeption','aufstehen'];
          const requiredCore = ["id:'questions-actions'","id:'countries-languages'","id:'personal-things'",'können','Woher kommen Sie?','Muttersprache'];
          const requiredCourse = ['Мои выражения','3–5 мин','7–10 мин','15 мин','ottoStartCourseV8','function interval(level)'];
          const requiredReading = ['Почему так читается?','soft-ch','hard-ch','final-e','v9-reading-gate'];
          const requiredCycle = ['Большое повторение','Переходный Mini‑A1','Hören','Lesen','Schreiben','Sprechen','data-v8-practice="use"','У вас есть необходимая базовая основа'];
          const requiredGuard = ['advanceUseSession','v9SpeakingAccepted','feedback.good'];
          const requiredAuth = ['request-code','save-progress','load-progress','scrypt','RESEND_API_KEY','TWILIO_ACCOUNT_SID'];
          const requiredStability = ["Element.prototype, 'innerHTML'","Node.prototype, 'textContent'","if (html.get.call(this) === next) return"];
          const requiredClientLog = ['event-loop-stall','dom-storm','stuck-click','/api/otto-start-client-log'];
          const requiredServerLog = ['otto-start-client-errors-v1','OTTO_LOG_READ_TOKEN','store.list','store.setJSON'];
          for (const needle of requiredIndex) if (!index.includes(needle)) throw new Error(`index.html missing: ${needle}`);
          for (const needle of requiredData) if (!data.includes(needle)) throw new Error(`course-data-v8.js missing: ${needle}`);
          for (const needle of requiredExtra) if (!extra.includes(needle)) throw new Error(`course-data-extra-v8.js missing: ${needle}`);
          for (const needle of requiredCore) if (!core.includes(needle)) throw new Error(`course-data-core-v8.js missing: ${needle}`);
          for (const needle of requiredCourse) if (!course.includes(needle)) throw new Error(`course-v8.js missing: ${needle}`);
          for (const needle of requiredReading) if (!reading.includes(needle)) throw new Error(`reading-coach-v9.js missing: ${needle}`);
          for (const needle of requiredCycle) if (!cycle.includes(needle)) throw new Error(`learning-cycle-v9.js missing: ${needle}`);
          for (const needle of requiredGuard) if (!cycleGuard.includes(needle)) throw new Error(`learning-cycle-guard-v9.js missing: ${needle}`);
          for (const needle of requiredAuth) if (!auth.includes(needle)) throw new Error(`otto-start-auth.js missing: ${needle}`);
          for (const needle of requiredStability) if (!stability.includes(needle)) throw new Error(`text-stability-v8.js missing: ${needle}`);
          for (const needle of requiredClientLog) if (!clientLog.includes(needle)) throw new Error(`client-log-v10.js missing: ${needle}`);
          for (const needle of requiredServerLog) if (!serverLog.includes(needle)) throw new Error(`otto-start-client-log.js missing: ${needle}`);
          if (index.includes('/otto-ui-experiment.js') || index.includes('/dom-stability-v4.js') || index.includes('/curriculum-stability-v6.js')) throw new Error('Conflict-prone legacy runtime module is loaded.');
          if (!(index.indexOf('learning-cycle-v9.js?v=9') < index.indexOf('course-v8.js?v=8'))) throw new Error('Learning cycle must register before course click handler.');
          console.log('Static learning-flow assertions passed.');
          NODE
          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error('Curriculum must contain at least 24 thematic blocks.');
          if (words.length < 500) throw new Error(`Curriculum word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          const requiredTopicIds=['start','person','alphabet','numbers','family','time','food','shopping','home','city','transport','work','free-time','health','weather','german','documents','daily-life','services','travel-hotel','environment','questions-actions','countries-languages','personal-things'];
          for(const id of requiredTopicIds) if(!d.topic(id)) throw new Error(`Missing topic: ${id}`);
          const family=d.topic('family');
          for(const needle of ['Mutter','Vater','Sohn','Tochter','Bruder','Schwester','Oma','Opa','Tante','Onkel']) if(!family.words.some(x=>x.de.includes(needle))) throw new Error(`Family coverage missing ${needle}`);
          const time=d.topic('time');
          for(const day of ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag']) if(!time.words.some(x=>x.de.includes(day))) throw new Error(`Weekday missing ${day}`);
          console.log('Curriculum coverage assertions passed.');
          NODE
