name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start stable cumulative bundle
        run: |
          test -f public/index.html
          test -f public/sw.js
          test -f public/manifest.webmanifest
          test -f public/request-timeout-v7.js
          test -f public/offline-v5.js
          test -f public/pronunciation-v5.js
          test -f public/speech-preload-queue-v7.js
          test -f public/course-data-v8.js
          test -f public/course-v8.js
          test -f public/stability-v8.js
          test -f public/learning-fixes-v4-guard.js
          test -f public/learning-fixes-v4.js
          test -f public/app-v2.js
          test -f public/enhancements-v2.js
          test -f netlify/functions/otto-tts.js
          node --check public/sw.js
          node --check public/request-timeout-v7.js
          node --check public/offline-v5.js
          node --check public/pronunciation-v5.js
          node --check public/speech-preload-queue-v7.js
          node --check public/course-data-v8.js
          node --check public/course-v8.js
          node --check public/stability-v8.js
          node --check public/learning-fixes-v4-guard.js
          node --check public/learning-fixes-v4.js
          node --check public/app-v2.js
          node --check public/enhancements-v2.js
          node --check netlify/functions/otto-tts.js
          grep -q "course-data-v8.js?v=8" public/index.html
          grep -q "course-v8.js?v=8" public/index.html
          grep -q "stability-v8.js?v=8" public/index.html
          grep -q "Otto Start" public/index.html
          grep -q "Немецкий с нуля" public/index.html
          grep -q "id:'family'" public/course-data-v8.js
          grep -q "id:'numbers'" public/course-data-v8.js
          grep -q "id:'documents'" public/course-data-v8.js
          grep -q "Großmutter" public/course-data-v8.js
          grep -q "Dienstag" public/course-data-v8.js
          grep -q "Sonntag" public/course-data-v8.js
          grep -q "einundzwanzig" public/course-data-v8.js
          grep -q "dreißig" public/course-data-v8.js
