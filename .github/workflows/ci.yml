name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start V17
        run: |
          set -e
          for file in \
            public/index.html public/otto-v12.css public/otto-v15.css public/curriculum-v16.css \
            public/client-log-v14.js public/runtime-v14.js \
            public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/speech-v17.js public/reading-rules-v15.js public/app-v15.js public/curriculum-v16.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for file in \
            public/client-log-v14.js public/runtime-v14.js public/course-data-v8.js \
            public/course-data-extra-v8.js public/course-data-core-v8.js public/speech-v17.js public/reading-rules-v15.js public/app-v15.js public/curriculum-v16.js public/base-preview-v3.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const app = fs.readFileSync('public/app-v15.js','utf8');
          const sharedRules = fs.readFileSync('public/reading-rules-v15.js','utf8');
          const previewHtml = fs.readFileSync('public/base-preview.html','utf8');
          const previewApp = fs.readFileSync('public/base-preview-v3.js','utf8');
          const auth = fs.readFileSync('netlify/functions/otto-start-auth.js','utf8');
          const speech = fs.readFileSync('public/speech-v17.js','utf8');
          const bridge = fs.readFileSync('public/curriculum-v16.js','utf8');
          const runtime = fs.readFileSync('public/runtime-v14.js','utf8');
          const tts = fs.readFileSync('netlify/functions/otto-tts.js','utf8');
          const pron = fs.readFileSync('netlify/functions/otto-start-pronunciation.js','utf8');

          for (const needle of ['otto-v15.css?v=20','curriculum-v16.css?v=20','speech-v17.js?v=20','reading-rules-v15.js?v=19','app-v15.js?v=20','curriculum-v16.js?v=20']) {
            if (!index.includes(needle)) throw new Error(`index missing ${needle}`);
          }
          for (const old of ['learning-fixes-v4.js','mutation-safety-v10.js','app-v2.js','app-v12.js?v=','app-v14.js?v=','speech-v12.js?v=','speech-v14.js?v=','speech-v15.js?v=','speech-v16.js?v=','pwa-v12.js','cache-reset-v13.js']) {
            if (index.includes(old)) throw new Error(`old runtime still loaded: ${old}`);
          }
          if (app.includes('new MutationObserver(') || app.includes('stopImmediatePropagation')) throw new Error('unstable DOM interception returned to core app');
          if (!runtime.includes('getRegistrations') || !runtime.includes('unregister')) throw new Error('stale service worker cleanup missing');
          if (!app.includes("ALPHA('a01'") || !app.includes("ALPHA('a02'")) throw new Error('alphabet progression missing');
          if (!app.includes("RULE('r01'") || !app.includes("RULE('r04'")) throw new Error('reading-rule progression missing');
          if (!app.includes('window.OttoReadingRulesV15')) throw new Error('main app does not consume shared reading-rule source');
          for (const rule of ['j','ei','ie','sch','ichch','achch','z','w','v','sp','st','eu','ss','umlaut','ending']) if (!sharedRules.includes(`id:'${rule}'`)) throw new Error(`shared main reading rule missing ${rule}`);
          for (const needle of ['course-data-v8.js?v=20','course-data-extra-v8.js?v=20','course-data-core-v8.js?v=20','reading-rules-v15.js?v=19','base-preview-v3.js?v=19']) if (!previewHtml.includes(needle)) throw new Error(`preview missing ${needle}`);
          if (!previewApp.includes('window.OttoReadingRulesV15') || !previewApp.includes('window.OttoCourseDataV8')) throw new Error('preview is not sourcing reading rules/vocabulary from shared project data');
          if (previewApp.includes('preview-register') || previewApp.includes('preview-login') || auth.includes('preview-register') || auth.includes('preview-login')) throw new Error('preview-only auth API actions must not exist');
          if (!bridge.includes('От нуля — именно к тренажёру A1') || !bridge.includes('Ещё важные особенности для A1')) throw new Error('visible A1 route or reading extras missing');
          if (!bridge.includes('window.OttoReadingExtraRulesV16')) throw new Error('curriculum does not consume shared extra reading rules');
          for (const rule of ['au','tsch','qu','ck','tz','pf','ng / nk','гласная + h','-ig в конце']) if (!sharedRules.includes(rule)) throw new Error(`shared extra reading feature missing ${rule}`);
          if (!app.includes('Мини‑тест готовности к Otto A1') || !app.includes('score>=80') || !app.includes('>=60')) throw new Error('A1 readiness test missing');
          if (!speech.includes('MALE_DE_NAMES') || !speech.includes('FEMALE_DE_NAMES') || !/utterance\.lang\s*=\s*['"]de-DE['"]/.test(speech)) throw new Error('strict German male browser voice selection missing');
          const playStart = speech.indexOf('async function play(');
          const playEnd = speech.indexOf('function preload()', playStart);
          const playBlock = speech.slice(playStart, playEnd);
          if (playStart < 0 || !/serverSpeak\(clean[\s\S]*browserMaleSpeak\(clean/.test(playBlock)) throw new Error('neural server voice is not first priority in play()');
          if (!speech.includes('getUserMedia') || !speech.includes('MediaRecorder') || !speech.includes('/api/otto-start-pronunciation')) throw new Error('real recording pipeline missing');
          if (!speech.includes('data-own-audio controls') || !speech.includes('data-play-own') || !speech.includes('Это именно ваша запись с микрофона')) throw new Error('own-recording playback controls missing');
          if (speech.includes('Автоматическое распознавание в этом браузере сейчас недоступно')) throw new Error('old browser-recognition failure message returned');
          if (!tts.includes("const OPENAI_VOICE = 'cedar'") || !tts.includes("const GEMINI_VOICE = 'Charon'") || !tts.includes('adult MALE native speaker')) throw new Error('male native German neural voice profile missing');
          if (!tts.includes('de-DE-hochdeutsch-male-v8') || !tts.includes('otto-tts-cache-de-v8-male')) throw new Error('male TTS cache version missing');
          if (!pron.includes('gpt-4o-mini-transcribe') || !pron.includes('assessWithGemini') || !pron.includes('transcribeWithOpenAI')) throw new Error('server pronunciation fallback pipeline missing');
          console.log('Otto Start V17 runtime assertions passed.');
          NODE

          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error(`Too few topics: ${d.topics.length}`);
          if (words.length < 500) throw new Error(`Word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          const alphabet = d.topic('alphabet');
          if (!alphabet?.alphabet || alphabet.alphabet.length < 30) throw new Error('German alphabet data missing');
          console.log('Curriculum coverage assertions passed.');
          NODE

      - name: Verify protected backend matches main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- netlify/functions/otto-start-auth.js netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js

      - name: Probe Deploy Preview TTS against production
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          PREVIEW="https://deploy-preview-${{ github.event.pull_request.number }}--otto-start.netlify.app"
          echo "Preview: $PREVIEW"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 15 "$PREVIEW/base-preview?v=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -q "base-preview-v3.js?v=19" /tmp/page.html; then break; fi
            echo "Waiting for preview page: HTTP $code ($i/30)"
            sleep 4
          done
          test "$code" = "200"

          auth_status=$(curl -sS -X POST "$PREVIEW/api/otto-start-auth" -H 'content-type: application/json' --data '{"action":"status"}' || true)
          prod_auth_status=$(curl -sS -X POST "https://otto-start.netlify.app/api/otto-start-auth" -H 'content-type: application/json' --data '{"action":"status"}' || true)
          echo "Preview auth provider status: $auth_status"
          echo "Production auth provider status: $prod_auth_status"

          probe_tts() {
            label="$1"; origin="$2"; out="/tmp/${label}.bin"; hdr="/tmp/${label}.headers"
            status=$(curl -sS -D "$hdr" -o "$out" -w '%{http_code}' --max-time 35 "$origin/api/otto-tts?text=Wasser&mode=normal&kind=text&v=17" || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\\r",""); print $2}' "$hdr" | tail -1)
            bytes=$(wc -c < "$out" | tr -d ' ')
            echo "TTS $label: status=$status content-type=$ctype bytes=$bytes"
            if [ "$status" != "200" ]; then
              echo "--- $label response ---"
              cat "$out" || true
              echo
            fi
          }
          probe_tts production "https://otto-start.netlify.app"
          probe_tts preview "$PREVIEW"

          status=$(curl -sS -o /tmp/preview-audio.bin -w '%{http_code}' --max-time 35 "$PREVIEW/api/otto-tts?text=Wasser&mode=normal&kind=text&v=17" || true)
          ctype=$(curl -sSI --max-time 20 "$PREVIEW/api/otto-tts?text=Wasser&mode=normal&kind=text&v=17" | awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\\r",""); print $2}' | tail -1)
          echo "Preview TTS diagnostic only: status=$status content-type=$ctype"
          if [ "$status" != "200" ]; then
            echo "TTS BLOCKER: existing backend is unavailable; no voice/model/backend substitution was made."
          fi

      - name: Install Playwright for live preview smoke
        if: always() && github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run live preview sound and microphone smoke
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--otto-start.netlify.app
        run: node tests/base-preview-live-smoke.mjs

      - name: Upload mobile preview screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: otto-start-authoritative-tz-v19
          path: test-artifacts/*.png
          if-no-files-found: warn
