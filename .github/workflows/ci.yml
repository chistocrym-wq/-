name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start offline and pronunciation bundle
        run: |
          test -f public/index.html
          test -f public/sw.js
          test -f public/manifest.webmanifest
          test -f public/offline-v5.js
          test -f public/pronunciation-v5.js
          test -f netlify/functions/otto-tts.js
          node --check public/sw.js
          node --check public/offline-v5.js
          node --check public/pronunciation-v5.js
          node --check netlify/functions/otto-tts.js
