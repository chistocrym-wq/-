name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start offline, pronunciation, stability and curriculum bundle
        run: |
          test -f public/index.html
          test -f public/sw.js
          test -f public/manifest.webmanifest
          test -f public/request-timeout-v7.js
          test -f public/offline-v5.js
          test -f public/offline-extra-v6.js
          test -f public/pronunciation-v5.js
          test -f public/curriculum-stability-v6.js
          test -f public/curriculum-corrections-v7.js
          test -f public/standalone-tech-v6.js
          test -f public/learning-fixes-v4-guard.js
          test -f netlify/functions/otto-tts.js
          node --check public/sw.js
          node --check public/request-timeout-v7.js
          node --check public/offline-v5.js
          node --check public/offline-extra-v6.js
          node --check public/pronunciation-v5.js
          node --check public/curriculum-stability-v6.js
          node --check public/curriculum-corrections-v7.js
          node --check public/standalone-tech-v6.js
          node --check public/learning-fixes-v4-guard.js
          node --check public/learning-fixes-v4.js
          node --check public/app-v2.js
          node --check public/enhancements-v2.js
          node --check netlify/functions/otto-tts.js
          grep -q "die Großmutter / Oma" public/curriculum-stability-v6.js
          grep -q "die Tochter" public/curriculum-stability-v6.js
          grep -q "Dienstag" public/curriculum-stability-v6.js
          grep -q "Sonntag" public/curriculum-stability-v6.js
          grep -q "neunzehn" public/curriculum-stability-v6.js
          grep -q "zwanzig" public/curriculum-stability-v6.js
          grep -q "NUM_1_10" public/curriculum-corrections-v7.js
          grep -q "NUM_11_20" public/curriculum-corrections-v7.js
          grep -q "request-timeout-v7.js?v=8" public/index.html
          grep -q "offline-extra-v6.js?v=6" public/index.html
          grep -q "curriculum-corrections-v7.js?v=7" public/index.html
          grep -q "standalone-tech-v6.js?v=9" public/index.html
