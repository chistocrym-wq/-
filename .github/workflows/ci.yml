name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Otto Start v14
        run: |
          set -e
          for file in \
            public/index.html public/otto-v12.css public/client-log-v12.js \
            public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/sw-kill-v14.js public/speech-v14.js public/app-v14.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for file in \
            public/client-log-v12.js public/course-data-v8.js public/course-data-extra-v8.js \
            public/course-data-core-v8.js public/sw-kill-v14.js public/speech-v14.js public/app-v14.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const app = fs.readFileSync('public/app-v14.js','utf8');
          const speech = fs.readFileSync('public/speech-v14.js','utf8');
          const kill = fs.readFileSync('public/sw-kill-v14.js','utf8');
          const tts = fs.readFileSync('netlify/functions/otto-tts.js','utf8');

          for (const needle of ['client-log-v12.js?v=14','sw-kill-v14.js?v=14','speech-v14.js?v=14','app-v14.js?v=14']) {
            if (!index.includes(needle)) throw new Error(`index missing ${needle}`);
          }
          for (const old of ['app-v12.js','speech-v12.js','pwa-v12.js','cache-reset-v13.js','learning-fixes-v4.js','course-v8.js','app-v2.js']) {
            if (index.includes(old)) throw new Error(`legacy runtime still loaded: ${old}`);
          }
          if (app.includes('MutationObserver')) throw new Error('v14 app must not use MutationObserver');
          if (app.includes('stopImmediatePropagation')) throw new Error('v14 app must not use stopImmediatePropagation');
          if (app.includes('Node.prototype') || app.includes('Element.prototype')) throw new Error('v14 app must not monkeypatch DOM prototypes');
          if (index.includes('serviceWorker.register') || speech.includes('serviceWorker.register')) throw new Error('service worker must not be re-registered during stabilization');
          if (!kill.includes('getRegistrations') || !kill.includes('unregister')) throw new Error('service worker cleanup missing');

          for (const needle of ["'Hallo'","'Да и нет'","'danke'","'bitte'","'Я и ты'","'Числа 0–3'","'Самая близкая семья'","'Бабушка, дедушка, тётя, дядя'","'Дни недели: 5–7'"]) {
            if (!app.includes(needle)) throw new Error(`beginner sequence missing ${needle}`);
          }
          if (!app.includes("const correct=String(item.ru")) throw new Error('quiz options are not based on Russian translation');
          if (!app.includes('Все варианты ответа — по-русски')) throw new Error('Russian answer guidance missing');
          if (!app.includes('size=12')) throw new Error('dictionary pagination must stay bounded');
          if (!app.includes("root.addEventListener('click'")) throw new Error('single click handler missing');

          if (!tts.includes("otto-tts-cache-de-v4")) throw new Error('TTS cache v4 missing');
          if (!tts.includes("de-DE-hochdeutsch-v4")) throw new Error('pronunciation version v4 missing');
          if (!tts.includes("mode === 'slow' ? 0.94 : 1.0")) throw new Error('natural slow pace missing');
          if (!tts.includes('Standarddeutsch/Hochdeutsch')) throw new Error('German TTS language guard missing');
          if (speech.includes('speechSynthesis') || speech.includes('SpeechSynthesisUtterance')) throw new Error('browser TTS fallback forbidden');
          console.log('Stable v14 runtime assertions passed.');
          NODE

          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error(`Too few topics: ${d.topics.length}`);
          if (words.length < 500) throw new Error(`Word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          const family = d.topic('family');
          for (const name of ['Mutter','Vater','Sohn','Tochter','Bruder','Schwester','Oma','Opa','Tante','Onkel']) {
            if (!family?.words.some(x => x.de.includes(name))) throw new Error(`Family coverage missing ${name}`);
          }
          console.log('Curriculum coverage assertions passed.');
          NODE
