name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate stable Otto Start runtime
        run: |
          set -e
          for file in \
            public/index.html public/otto-v12.css public/client-log-v12.js \
            public/course-data-v8.js public/course-data-extra-v8.js public/course-data-core-v8.js \
            public/sw-kill-v14.js public/speech-v12.js public/app-v12.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for file in \
            public/client-log-v12.js public/course-data-v8.js public/course-data-extra-v8.js \
            public/course-data-core-v8.js public/sw-kill-v14.js public/speech-v12.js public/app-v12.js \
            netlify/functions/otto-tts.js netlify/functions/otto-start-pronunciation.js \
            netlify/functions/otto-start-support.js netlify/functions/otto-start-client-log.js; do
            node --check "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('public/index.html','utf8');
          const app = fs.readFileSync('public/app-v12.js','utf8');
          const speech = fs.readFileSync('public/speech-v12.js','utf8');
          const kill = fs.readFileSync('public/sw-kill-v14.js','utf8');
          const tts = fs.readFileSync('netlify/functions/otto-tts.js','utf8');

          for (const needle of ['client-log-v12.js?v=15','sw-kill-v14.js?v=15','speech-v12.js?v=15','app-v12.js?v=15']) {
            if (!index.includes(needle)) throw new Error(`index missing ${needle}`);
          }
          for (const old of ['learning-fixes-v4.js','mutation-safety-v10.js','course-v8.js','app-v2.js','app-v14.js','speech-v14.js']) {
            if (index.includes(old)) throw new Error(`unstable runtime still loaded: ${old}`);
          }
          if (app.includes('MutationObserver')) throw new Error('stable app must not use MutationObserver');
          if (app.includes('stopImmediatePropagation')) throw new Error('stable app must not use stopImmediatePropagation');
          if (!kill.includes('getRegistrations') || !kill.includes('unregister')) throw new Error('stale service worker cleanup missing');
          if (!app.includes('Все варианты — перевод на русский') || !app.includes('Выберите значение на русском языке')) throw new Error('Russian quiz direction missing');
          if (!app.includes('pageSize = 20')) throw new Error('dictionary pagination missing');
          if (speech.includes('speechSynthesis') || speech.includes('SpeechSynthesisUtterance')) throw new Error('browser TTS fallback forbidden');
          if (!tts.includes('otto-tts-cache-de-v4') || !tts.includes('de-DE-hochdeutsch-v4')) throw new Error('German TTS v4 missing');
          if (!tts.includes('speechUrls()') || !tts.includes('Standarddeutsch/Hochdeutsch')) throw new Error('gateway-aware German TTS guard missing');
          console.log('Stable Otto Start runtime assertions passed.');
          NODE

          node --input-type=module <<'NODE'
          globalThis.window = {};
          await import('./public/course-data-v8.js');
          await import('./public/course-data-extra-v8.js');
          await import('./public/course-data-core-v8.js');
          const d = window.OttoCourseDataV8;
          const words = d.allWords();
          const phrases = d.allPhrases();
          console.log(`Curriculum: ${d.topics.length} topics, ${words.length} word entries, ${phrases.length} expressions`);
          if (d.topics.length < 24) throw new Error(`Too few topics: ${d.topics.length}`);
          if (words.length < 500) throw new Error(`Word coverage too small: ${words.length}`);
          if (phrases.length < 95) throw new Error(`Expression coverage too small: ${phrases.length}`);
          const family = d.topic('family');
          for (const name of ['Mutter','Vater','Sohn','Tochter','Bruder','Schwester','Oma','Opa','Tante','Onkel']) {
            if (!family?.words.some(x => x.de.includes(name))) throw new Error(`Family coverage missing ${name}`);
          }
          console.log('Curriculum coverage assertions passed.');
          NODE
