name: Otto Start Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local interaction smoke
        run: node tests/smoke-v12.mjs
      - name: Wait for production stable runtime deploy
        shell: bash
        run: |
          set -e
          for i in $(seq 1 40); do
            html=$(curl -fsSL --max-time 10 "https://otto-start.netlify.app/?smoke=${GITHUB_SHA}" || true)
            if echo "$html" | grep -q 'app-v12.js?v=17'; then
              echo "Stable production HTML is live"
              exit 0
            fi
            echo "Waiting for stable production ($i)"
            sleep 5
          done
          echo "Production did not expose stable runtime in time"
          exit 1
      - name: Verify German neural TTS endpoint
        shell: bash
        run: |
          set -e
          status=$(curl -sS --max-time 30 -D tts-headers.txt -o tts.mp3 -w "%{http_code}" \
            -X POST "https://otto-start.netlify.app/api/otto-tts" \
            -H "Content-Type: application/json" \
            --data '{"text":"Hallo","mode":"slow"}')
          cat tts-headers.txt
          test "$status" = "200" || { echo "TTS HTTP $status"; cat tts.mp3; exit 1; }
          grep -qi '^content-type: audio/mpeg' tts-headers.txt || { echo "TTS did not return MP3"; exit 1; }
          grep -qi '^x-otto-pronunciation: de-DE-hochdeutsch-v4' tts-headers.txt || { echo "Wrong pronunciation version"; exit 1; }
          size=$(wc -c < tts.mp3)
          test "$size" -gt 1000 || { echo "TTS audio unexpectedly small: $size"; exit 1; }
          echo "German TTS v4 returned $size bytes"
