name: Otto Start Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local V16 interaction smoke
        run: node tests/smoke-v12.mjs
      - name: Wait for production V16 deploy
        shell: bash
        run: |
          set -e
          for i in $(seq 1 45); do
            html=$(curl -fsSL --max-time 10 "https://otto-start.netlify.app/?smoke=${GITHUB_SHA}" || true)
            if echo "$html" | grep -q 'speech-v16.js?v=19' && echo "$html" | grep -q 'curriculum-v16.js?v=19'; then
              echo "V16 production HTML is live"
              exit 0
            fi
            echo "Waiting for V16 production ($i)"
            sleep 5
          done
          echo "Production did not expose V16 runtime in time"
          exit 1
      - name: Verify production V16 assets
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 20 "https://otto-start.netlify.app/speech-v16.js?v=19" -o speech-v16.js
          curl -fsSL --max-time 20 "https://otto-start.netlify.app/curriculum-v16.js?v=19" -o curriculum-v16.js
          curl -fsSL --max-time 20 "https://otto-start.netlify.app/curriculum-v16.css?v=19" -o curriculum-v16.css
          grep -q 'speechSynthesis' speech-v16.js
          grep -q 'getUserMedia' speech-v16.js
          grep -q 'MediaRecorder' speech-v16.js
          grep -q 'data-play-own' speech-v16.js
          grep -q 'От нуля — именно к тренажёру A1' curriculum-v16.js
          grep -q 'Ещё важные особенности для A1' curriculum-v16.js
          grep -q 'v16-a1-roadmap' curriculum-v16.css
          echo "Production V16 fallback audio, recording, A1 route and reading assets are published"
