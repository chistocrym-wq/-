<!doctype html>
<html lang="ru" class="otto-splash-active">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f8f6" />
  <meta name="description" content="Otto Start — От уровня &quot;ноль&quot; к тренажёру А1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Otto Start" />
  <title>Otto Start — немецкий с нуля</title>
  <link rel="manifest" href="/manifest.webmanifest?v=23" />
  <link rel="icon" href="/otto-icon-transparent-192.png?v=23" type="image/png" />
  <link rel="preload" as="image" href="/otto/otto-home.webp" type="image/webp" />
  <link rel="preload" as="image" href="/otto/otto-guide.webp" type="image/webp" />
  <link rel="stylesheet" href="/otto-v12.css?v=20" />
  <link rel="stylesheet" href="/otto-v15.css?v=20" />
  <link rel="stylesheet" href="/curriculum-v16.css?v=20" />
  <link rel="stylesheet" href="/requested-ui-v22.css?v=23" />
  <style>
    html,body{background:#f5f8f6}
    html.otto-splash-active,html.otto-splash-active body{background:#fff}
    #otto-splash-stable{position:fixed;inset:0;z-index:60000;display:grid;place-items:center;background:#fff;opacity:1;transition:opacity 2.3s ease-in-out;pointer-events:none}
    #otto-splash-stable.out{opacity:0}
    #otto-splash-stable div{width:128px;height:128px;display:grid;place-items:center;background:transparent;border:0;box-shadow:none}
    #otto-splash-stable img{width:112px;height:112px;object-fit:contain;opacity:0;transition:opacity 1.4s ease-in-out}
    #otto-splash-stable.show-otto img{opacity:1}
  </style>
</head>
<body>
  <div id="otto-splash-stable" aria-hidden="true"><div><img src="/otto/otto-home.webp" alt=""></div></div>
  <div id="app"></div>

  <script src="/client-log-v14.js?v=20" defer></script>
  <script src="/runtime-v14.js?v=20" defer></script>
  <script src="/course-data-v8.js?v=20" defer></script>
  <script src="/course-data-extra-v8.js?v=20" defer></script>
  <script src="/course-data-core-v8.js?v=20" defer></script>
  <script src="/speech-v17.js?v=20" defer></script>
  <script src="/voice-fix-v18.js?v=21" defer></script>
  <script src="/app-v15.js?v=20" defer></script>
  <script src="/curriculum-v16.js?v=20" defer></script>
  <script src="/requested-ui-v22.js?v=22" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const splash=document.getElementById('otto-splash-stable');
      if(!splash)return;
      const WHITE_HOLD=800;
      const OTTO_FADE_IN=1400;
      const OTTO_HOLD=1200;
      const SPLASH_FADE_OUT=2300;
      let appReady=false;
      let fadeRequested=false;
      const removeSplash=()=>{
        splash.remove();
        document.documentElement.classList.remove('otto-splash-active');
      };
      const beginFadeOut=()=>{
        if(fadeRequested||!appReady)return;
        fadeRequested=true;
        splash.classList.add('out');
        setTimeout(removeSplash,SPLASH_FADE_OUT+80);
      };
      const waitForApp=()=>{
        if(document.getElementById('app')?.children.length){appReady=true;beginFadeOut();return;}
        setTimeout(waitForApp,30);
      };
      setTimeout(()=>{
        splash.classList.add('show-otto');
        setTimeout(beginFadeOut,OTTO_FADE_IN+OTTO_HOLD);
      },WHITE_HOLD);
      waitForApp();
    },{once:true});
  </script>
</body>
</html>
