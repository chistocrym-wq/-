<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f8f6" />
  <meta name="description" content="Otto Start — немецкий с абсолютного нуля: короткие занятия и большой накопительный путь к базе A1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Otto Start" />
  <title>Otto Start — немецкий с нуля</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/otto-icon-192.webp" type="image/webp" />
  <link rel="preload" as="image" href="/otto/otto-home.webp" type="image/webp" />
  <link rel="preload" as="image" href="/otto/otto-guide.webp" type="image/webp" />
  <link rel="stylesheet" href="/otto-v12.css?v=12" />
  <style>
    html,body{background:#f5f8f6}
    #otto-splash-v12{position:fixed;inset:0;z-index:60000;display:grid;place-items:center;background:#f5f8f6;opacity:1;transition:opacity .28s ease;pointer-events:none}
    #otto-splash-v12.out{opacity:0}
    #otto-splash-v12 div{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:#edf6f4;border:1px solid #dbeae7;box-shadow:0 18px 52px rgba(23,63,67,.10)}
    #otto-splash-v12 img{width:112px;height:112px;object-fit:contain}
  </style>
</head>
<body>
  <div id="otto-splash-v12" aria-hidden="true"><div><img src="/otto/otto-home.webp" alt=""></div></div>
  <div id="app"></div>

  <script src="/client-log-v12.js?v=12" defer></script>
  <script src="/course-data-v8.js?v=8" defer></script>
  <script src="/course-data-extra-v8.js?v=8" defer></script>
  <script src="/course-data-core-v8.js?v=8" defer></script>
  <script src="/speech-v12.js?v=12" defer></script>
  <script src="/pwa-v12.js?v=12" defer></script>
  <script src="/app-v12.js?v=12" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const splash=document.getElementById('otto-splash-v12');
      if(!splash)return;
      const started=performance.now();
      const finish=()=>{
        const wait=Math.max(0,420-(performance.now()-started));
        setTimeout(()=>{splash.classList.add('out');setTimeout(()=>splash.remove(),300)},wait);
      };
      const check=()=>document.getElementById('app')?.children.length?finish():setTimeout(check,40);
      check();
      setTimeout(finish,1800);
    },{once:true});
  </script>
</body>
</html>
